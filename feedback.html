    <link rel="stylesheet" href="feedback.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

</head>

<body>

    <!-- Sticky Navigation Bar -->
    <header class="nav">
        <img src="IMG_6876-modified.png" alt="Logo" class="logo">
        <nav>
            <ul>
                <li><a href="http://127.0.0.1:5500/index.html">Home</a></li>
                <li><a href="http://127.0.0.1:5500/About/about.html">About</a></li>
                <li><a href="http://127.0.0.1:5500/Courses/courses.html">Courses</a></li>
                <li><a href="http://127.0.0.1:5500/Contact%20form/contact.html">Contact Us</a></li>
            </ul>
        </nav>

        <!-- Auth Buttons -->
        <div class="auth-buttons" id="auth-buttons">
            <button id="login-btn" class="login" onclick="location.href='login/login.html'">Login</button>
            <button id="signup-btn" class="signup" onclick="location.href='Signup/signup.html'">Sign Up</button>
        </div>

        <!-- Profile Section -->
        <div id="profile-section" style="display: none;">
            <div class="profile-icon" id="user-profile"></div>
            <div id="dropdown" class="profile-dropdown">
                <div class="profile-icon large" id="dropdown-initials"></div>
                <div class="dropdown-info">
                    <p id="dropdown-name"></p>
                    <p id="dropdown-email"></p>
                    <button id="signout-btn">Sign Out</button>
                </div>
            </div>
        </div>
    </header>

    <script>
        let lastScrollTop = 0;
        const navbar = document.querySelector('.nav');
        const maxScroll = 50; // Maximum scroll distance for the effect

        window.addEventListener('scroll', () => {
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollDiff = scrollTop - lastScrollTop;

            // Calculate the current transform
            const currentTransform = navbar.style.transform || 'translateX(-50%)';
            const currentY = parseFloat(currentTransform.match(/translateY\(([-\d.]+)px\)/)?.[1] || 0);
            const currentRotate = parseFloat(currentTransform.match(/rotateX\(([-\d.]+)deg\)/)?.[1] || 0);


            // Calculate new Y and rotation values
            let newY = Math.max(0, Math.min(currentY + scrollDiff * 0.1, maxScroll));
            let newRotate = newY / maxScroll * 5; // Max rotation of 5 degrees

            // Apply the new transform
            navbar.style.transform = `translateX(-50%) translateY(${newY}px) rotateX(${newRotate}deg)`;

            lastScrollTop = scrollTop;
        });
    </script>

    <!-- Feedback Display -->
    <main>
        <div id="feedback-container" class="container mt-4"></div>
          
    </main>

    <script>
        (function () { if (!window.chatbase || window.chatbase("getState") !== "initialized") { window.chatbase = (...arguments) => { if (!window.chatbase.q) { window.chatbase.q = [] } window.chatbase.q.push(arguments) }; window.chatbase = new Proxy(window.chatbase, { get(target, prop) { if (prop === "q") { return target.q } return (...args) => target(prop, ...args) } }) } const onLoad = function () { const script = document.createElement("script"); script.src = "https://www.chatbase.co/embed.min.js"; script.id = "KECOGpal1tloGRlFnVFZ9"; script.domain = "www.chatbase.co"; document.body.appendChild(script) }; if (document.readyState === "complete") { onLoad() } else { window.addEventListener("load", onLoad) } })();
    </script>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous">
        </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous">
        </script>
    <script type="module" src="feedback.js"></script>

</body>
