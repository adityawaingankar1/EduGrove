<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resources - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <script type="module" src="login.js" defer></script>
</head>
<body>

    <!-- Sticky Navigation Bar -->
    <header class="nav">
        <img src="IMG_6876.JPG" alt="Logo" class="logo">
        <nav>
            <ul>
                <li><a href="http://127.0.0.1:5500/index.html">Home</a></li>
                <li><a href="About/about.html" onclick="checkLogin(event, 'About/about.html')">About</a></li>
                <li><a href="Courses/courses.html" onclick="checkLogin(event, 'Courses/courses.html')">Courses</a></li>
                <li><a href="Contact form/contact.html" onclick="checkLogin(event, 'Contact form/contact.html')">Contact Us</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <button onclick="location.href='http://127.0.0.1:5500/Signup/signup.html'" class="signup">Sign Up</button>
        </div>
    </header>

    <main class="login-container">
        <h2>Welcome Back</h2>
        <form id="login-form">
            <div class="input-group">
                <input type="email" id="email" placeholder="Enter Email" required>
                <label for="email">Email</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="Enter Password" required>
                <label for="password">Password</label>
            </div>
            <button type="submit">Log In</button>
        </form>

        <div class="links">
            <a href="http://127.0.0.1:5500/Forgot%20Password/fp.html">Forgot Password?</a>
            <a href="http://127.0.0.1:5500/Signup/signup.html">Sign Up</a>
        </div>
    </main>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
          e.preventDefault();
        
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
        
          const res = await fetch('http://localhost:3000/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
          });
        
          const data = await res.json();
          if (res.ok) {
            alert('Login successful!');
            localStorage.setItem('userId', data.userId);
            window.location.href = 'http://127.0.0.1:5500/index.html';
          } else {
            alert('Login failed: ' + data.message);
          }
        });
        </script>

    <footer>
        <p>&copy; 2025 Student Resources. All Rights Reserved.</p>
    </footer>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCE9rLPJb6yquVNcLqVoHJAiPXk-33eeFo",
            authDomain: "login-example-abf20.firebaseapp.com",
            projectId: "login-example-abf20",
            storageBucket: "login-example-abf20.firebasestorage.app",
            messagingSenderId: "620711411544",
            appId: "1:620711411544:web:2c042f20fb6e99f7fb2f2d",
            measurementId: "G-8YF8GX9H0G"
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged(function (user) {
            if (user) {
                // User is signed in, show all content
                document.querySelectorAll('.protected-content').forEach(el => {
                    el.style.display = 'block';
                });
                document.getElementById('login-message').style.display = 'none';
            } else {
                // User is not signed in, hide protected content
                document.querySelectorAll('.protected-content').forEach(el => {
                    el.style.display = 'none';
                });
                document.getElementById('login-message').style.display = 'block';
            }
        });
    </script>
    <script>
        // Make sure Firebase is initialized somewhere before this

        function checkLogin(event, targetUrl) {
            event.preventDefault();

            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    // User is signed in, allow redirection
                    window.location.href = targetUrl;
                } else {
                    // User not signed in, redirect to login page
                    alert("Please login to continue.");
                    window.location.href = "login/login.html"; // Adjust the path if needed
                }
            });
        }
    </script>
    

</body>
</html>
