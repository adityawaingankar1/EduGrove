<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Resources - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="signup.css">
    
</head>
<body>

    <!-- Navigation Bar -->
    <header class="nav">
        <img src="IMG_6876-modified.png" alt="Logo" class="logo">
        <nav>
            <ul>
                <li><a href="http://127.0.0.1:5500/index.html">Home</a></li>
                <li><a href="About/about.html" onclick="checkLogin(event, 'About/about.html')">About</a></li>
                <li><a href="Courses/courses.html" onclick="checkLogin(event, 'Courses/courses.html')">Courses</a></li>
                <li><a href="Contact form/contact.html" onclick="checkLogin(event, 'Contact form/contact.html')">Contact Us</a></li>
            </ul>
        </nav>
        <div class="auth-buttons">
            <button onclick="location.href='http://127.0.0.1:5500/login/login.html'"class="login">Login</button>
            
        </div>
    </header>

    <!-- Signup Form -->
    <div class="signup-container">
        <h1>Create Your Account</h1>
        <form id="signupForm" onsubmit="submitForm(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="enter your email" required>
            </div>
        
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" class="form-control" id="password" placeholder="enter your password" required>
                <span class="input-group-text toggle-password" onclick="togglePassword('password')">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

            <div class="form-group">
                <label for="password">Confirm Password</label>
                <input type="password" class="form-control" id="password" placeholder="enter confirm password" required>
                <span class="input-group-text toggle-password" onclick="togglePassword('password')">
                    <i class="fas fa-eye"></i>
                </span>
            </div>

        
            <button type="submit" class="btn signup-btn">Sign Up</button>

            <div class="login-link">
                <p>Already have an account? <a href="http://127.0.0.1:5500/login/login.html">Log in</a></p>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
          e.preventDefault();
        
          const username = document.getElementById('username').value.trim();
          const email = document.getElementById('email').value.trim();
          const password = document.getElementById('password').value;
        
          const res = await fetch('http://localhost:3000/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, email, password })
          });
        
          const data = await res.json();
          if (res.ok) {
            alert('Signup successful! Please login.');
            window.location.href = '../login/login.html';
          } else {
            alert('Signup failed: ' + data.error || data.message);
          }
        });
        </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="signup.js" defer></script>

    <footer>
        <p>&copy; 2025 Student Resources. All Rights Reserved.</p>
    </footer>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCE9rLPJb6yquVNcLqVoHJAiPXk-33eeFo",
            authDomain: "login-example-abf20.firebaseapp.com",
            projectId: "login-example-abf20",
            storageBucket: "login-example-abf20.firebasestorage.app",
            messagingSenderId: "620711411544",
            appId: "1:620711411544:web:2c042f20fb6e99f7fb2f2d",
            measurementId: "G-8YF8GX9H0G"
        };
        firebase.initializeApp(firebaseConfig);

        firebase.auth().onAuthStateChanged(function (user) {
            if (user) {
                // User is signed in, show all content
                document.querySelectorAll('.protected-content').forEach(el => {
                    el.style.display = 'block';
                });
                document.getElementById('login-message').style.display = 'none';
            } else {
                // User is not signed in, hide protected content
                document.querySelectorAll('.protected-content').forEach(el => {
                    el.style.display = 'none';
                });
                document.getElementById('login-message').style.display = 'block';
            }
        });
    </script>
    <script>
        // Make sure Firebase is initialized somewhere before this

        function checkLogin(event, targetUrl) {
            event.preventDefault();

            firebase.auth().onAuthStateChanged((user) => {
                if (user) {
                    // User is signed in, allow redirection
                    window.location.href = targetUrl;
                } else {
                    // User not signed in, redirect to login page
                    alert("Please login to continue.");
                    window.location.href = "login/login.html"; // Adjust the path if needed
                }
            });
        }
    </script>
    

</body>
</html>
